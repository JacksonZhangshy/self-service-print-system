# ============================================================
# 自助收费打印系统 · Docker Compose 一键部署
#
# 用法：
#   cp .env.example .env && vi .env         # 至少改 DB_PASSWORD / ADMIN_PASSWORD / AGENT_TOKEN / PUBLIC_BASE_URL
#   docker compose up -d --build
#   docker compose logs -f backend
#
# 说明：
#   - 前端 Nginx 对外暴露 80；生产环境建议在其前面再放一层 TLS 网关（或加上 certbot 容器）
#   - 支付回调要求外网可达：把 PUBLIC_BASE_URL 指向本机公网域名
#   - 打印助手不跑在容器里（要直连打印机），在打印电脑上单独运行，指向 http://<服务器IP>
# ============================================================

services:
  mysql:
    image: mysql:8.4
    container_name: printsys-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-change-me}
      MYSQL_DATABASE: ${DB_NAME:-print_system}
      MYSQL_USER: ${DB_USER:-printsys}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-this-db-password}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅在数据卷为空时执行一次
      - ./backend/schema-mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [printsys]

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    image: printsys/backend:1.1.0
    container_name: printsys-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-print_system}
      DB_USER: ${DB_USER:-printsys}
      DB_PASSWORD: ${DB_PASSWORD:-change-this-db-password}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      AGENT_TOKEN: ${AGENT_TOKEN:?必须设置 AGENT_TOKEN（与打印助手一致）}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?必须设置 ADMIN_PASSWORD}
      DEMO_MODE: ${DEMO_MODE:-false}
      IDLE_MINUTES: ${IDLE_MINUTES:-15}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      SMS_CODE_SALT: ${SMS_CODE_SALT:-printsys}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:-}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:-}
      TENCENT_SMS_SDK_APP_ID: ${TENCENT_SMS_SDK_APP_ID:-}
      TENCENT_SMS_SIGN_NAME: ${TENCENT_SMS_SIGN_NAME:-}
      TENCENT_SMS_TEMPLATE_ID: ${TENCENT_SMS_TEMPLATE_ID:-}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_WEBHOOK_TOKEN: ${SMS_WEBHOOK_TOKEN:-}
      CONVERT_ENABLED: ${CONVERT_ENABLED:-true}
      CONVERT_ALLOW_ESTIMATE: ${CONVERT_ALLOW_ESTIMATE:-false}
      ORDER_EXPIRE_MINUTES: ${ORDER_EXPIRE_MINUTES:-10}
      MAX_PAGES: ${MAX_PAGES:-500}
      TASK_CLAIM_TIMEOUT_MINUTES: ${TASK_CLAIM_TIMEOUT_MINUTES:-15}
      TASK_MAX_RETRY: ${TASK_MAX_RETRY:-2}
      AUTO_REFUND_ON_FAILURE: ${AUTO_REFUND_ON_FAILURE:-true}
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS:-7}
      FILE_MAX_MB: ${FILE_MAX_MB:-100}
      PAY_MOCK_ENABLED: ${PAY_MOCK_ENABLED:-false}
      ALIPAY_ENABLED: ${ALIPAY_ENABLED:-true}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_SELLER_ID: ${ALIPAY_SELLER_ID:-}
      WECHAT_ENABLED: ${WECHAT_ENABLED:-true}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:-}
      WECHAT_API_V3_KEY: ${WECHAT_API_V3_KEY:-}
      WECHAT_MERCHANT_SERIAL_NO: ${WECHAT_MERCHANT_SERIAL_NO:-}
      WECHAT_PRIVATE_KEY: ${WECHAT_PRIVATE_KEY:-}
      WECHAT_PLATFORM_CERTS: ${WECHAT_PLATFORM_CERTS:-}
    volumes:
      - uploads:/opt/printsys/data/uploads
      - logs:/opt/printsys/logs
    networks: [printsys]

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    image: printsys/frontend:1.1.0
    container_name: printsys-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    networks: [printsys]

volumes:
  mysql-data:
  uploads:
  logs:

networks:
  printsys:
    driver: bridge
