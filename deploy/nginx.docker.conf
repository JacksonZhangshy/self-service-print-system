# ============================================================
# 自助收费打印系统 · Nginx 容器内配置
# 与 deploy/nginx.conf 的差别：监听 80（TLS 由外层网关/负载均衡终止），
# 后端走 docker 网络里的服务名 backend
# ============================================================

upstream printsys_backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 110m;
    client_body_timeout 300s;
    send_timeout 300s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://printsys_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }

    location /mock-pay/ {
        proxy_pass http://printsys_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        access_log off;
        proxy_pass http://printsys_backend/api/health;
    }
}
