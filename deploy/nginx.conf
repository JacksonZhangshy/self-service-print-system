# ============================================================
# 自助收费打印系统 · Nginx 站点配置
# 放置：/etc/nginx/conf.d/printsys.conf
# 前置：前端已构建到 /opt/printsys/frontend/dist
#      后端监听 127.0.0.1:8080（不对外暴露）
# 证书用 certbot 申请后，把 server_name 与 ssl 证书路径替换成自己的
# ============================================================

upstream printsys_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP → HTTPS（首次申请证书时可临时注释本段）
server {
    listen 80;
    listen [::]:80;
    server_name print.example.com;

    # 让 certbot 的 webroot 校验能通过
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name print.example.com;

    ssl_certificate     /etc/letsencrypt/live/print.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/print.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 上传上限要与后端 spring.servlet.multipart.max-request-size 对齐（110MB）
    client_max_body_size 110m;
    client_body_timeout 300s;
    send_timeout 300s;

    # 压缩（Element Plus 的 CSS 约 360KB，压缩后 48KB）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2;

    # ---------------- 前端静态资源 ----------------
    root /opt/printsys/frontend/dist;
    index index.html;

    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 单页应用：任何前端路由都回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ---------------- 后端接口 ----------------
    location /api/ {
        proxy_pass http://printsys_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;             # 文件下载直接透传，避免大文件占内存
    }

    # 上传接口单独放宽超时（服务端要跑 LibreOffice 转换）
    location /api/files/upload {
        proxy_pass http://printsys_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 模拟支付页（仅在 PAY_MOCK_ENABLED=true 时有用，生产可整段删除）
    location /mock-pay/ {
        proxy_pass http://printsys_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 健康检查：给负载均衡/监控用
    location = /health {
        access_log off;
        proxy_pass http://printsys_backend/api/health;
    }

    access_log /var/log/nginx/printsys.access.log;
    error_log  /var/log/nginx/printsys.error.log warn;
}
